[package]
name = "xtask"
description = "Repository tooling: architecture boundaries, contract generation and checks, module map, ADR gate."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

# Tooling only: never a dependency of a ulei crate, never shipped. Not covered by the MSRV job.
[dependencies]
jsonschema = { version = "0.61", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
