name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Base revision for the ADR gate and the schema compatibility check: the PR base, or the
  # previous tip of main on push. Empty (or all zeros) means "format checks only".
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --all-features: the feature-gated `ulei-web` helper and its tests (ADR-0015).
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # crates/hive-mcp/tests/real_hive.rs runs the hive's CLI with the `python3` on PATH; its
      # cron series need the hive's one runtime package (ADR-0082), so the runtime lock goes first.
      - name: The hive's runtime lock on PATH
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/hive-py-venv"
          "$RUNNER_TEMP/hive-py-venv/bin/pip" install --require-hashes --no-deps -r hive-py/requirements.lock
          echo "$RUNNER_TEMP/hive-py-venv/bin" >> "$GITHUB_PATH"
      # Includes the contract consumer tests (crates/contracts/tests/fixtures.rs) and the
      # xtask unit tests (boundary violations, schema compatibility, ADR parsing).
      - run: cargo test --workspace --all-features --locked
      # ADR-0054 section 5: the token figures of the system prompt's core tier as a notice.
      - run: cargo test --locked --all-features -p ulei-engine --test prompt the_core_tier_fits_its_token_ceiling -- --exact --nocapture

  # ADR-0087 E12a: the workspace on aarch64, natively on the arm64 runner. Clippy compiles the NEON
  # kernel (`#[cfg(target_arch = "aarch64")]`), which no x86 job builds; `ulei-infer`'s tests run
  # with NEON picked by `Kernel::best()` and every kernel against `portable` in `kernels::fuzz`;
  # the MSRV check covers the aarch64 intrinsics and inline assembly too.
  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89" # keep in sync with workspace.package.rust-version
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: CPU features of the runner
        run: grep -m1 -E '^Features' /proc/cpuinfo | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked -p ulei-infer --all-features
      - run: cargo +1.89 check --locked -p ulei-infer --all-targets --all-features

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.89" # keep in sync with workspace.package.rust-version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --exclude xtask --all-targets --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories bans licenses sources

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Self-test of the scan rule
        run: python3 ci/gitleaks_scan.py ./gitleaks self-test
      - name: Scan the history of the checked-out commit
        run: python3 ci/gitleaks_scan.py ./gitleaks scan

  # Module boundaries over the crate graph (replaces import-linter), source bans, generated
  # module map, ADR gate, shell lint.
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Crate-graph boundaries and source bans
        run: cargo xtask arch
      - name: module-map.md is up to date
        run: cargo xtask module-map --check
      - name: ADR gate
        run: cargo xtask adr --base "$BASE_SHA"
      - name: Shell scripts
        run: shellcheck ci/*.sh deploy/*.sh
      - name: Rollback script on a fake environment
        timeout-minutes: 2
        run: python3 ci/rollback_run.py "$(mktemp -d)"
      # ADR-0096: the frozen selection set equals its generator, and the judge eval runner
      # renders the night's prompt and scores a scripted judge (no model is called).
      - name: Reconcile evals without a model
        timeout-minutes: 2
        run: |
          python3 -I ci/reconcile_eval/gen.py --check crates/garden/tests/fixtures/reconcile-eval
          python3 -I ci/judge_eval.py --self-test

  # The Python task hive (ADR-0068 section 3): the image's CPython 3.12, both locks installed
  # by hash, the suite in a loopback-only network namespace as the runner's user.
  hive-py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Interpreter is CPython 3.12
        run: >-
          /usr/bin/python3 -c 'import platform, sys;
          impl = platform.python_implementation();
          sys.exit(None if impl == "CPython" and sys.version_info[:2] == (3, 12)
          else f"hive-py needs CPython 3.12, found {impl} {sys.version}")'
      - name: Install both locks (the only step with network)
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/hive-py-venv"
          "$RUNNER_TEMP/hive-py-venv/bin/pip" install --require-hashes --no-deps -r hive-py/requirements.lock
          "$RUNNER_TEMP/hive-py-venv/bin/pip" install --require-hashes --no-deps -r hive-py/requirements-test.lock
      - name: Tests without network
        run: |
          sudo unshare --net -- sh -c '
            set -e
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --groups="$3" -- \
              env HOME="$4" "$5" -m pytest hive-py/tests -q -p no:cacheprovider
          ' sh "$(id -u)" "$(id -g)" "$(id -G | tr ' ' ,)" "$HOME" "$RUNNER_TEMP/hive-py-venv/bin/python"

  # Metaschema, fixtures (valid accepted, invalid rejected), CHANGELOG entries, generated Rust
  # types without diff, and compatibility against the base revision.
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask contracts --base "$BASE_SHA"

  budgets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # musl-gcc compiles the bundled SQLite of ulei-core and ulei-engine for the musl target
      # (ADR-0007, ADR-0014).
      - run: sudo apt-get install -y --no-install-recommends strace musl-tools
      # Separate builds: one build of both packages unifies their dependency features and
      # changes the ulei-core binaries under measurement. ulei-core builds ulei, ulei-inbox and
      # the connector runner ulei-connectors (ADR-0056 section 8).
      - run: cargo build --release --locked -p ulei-core --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-engine --target x86_64-unknown-linux-musl
      # The engine's normal dependency graph holds no TLS crate (ADR-0015 section 2).
      - run: "! cargo tree --locked -p ulei-engine -e normal --target x86_64-unknown-linux-musl | grep -wE 'ureq|rustls|ring|webpki-roots'"
      # The shipped helper, and the helper with the loopback test switch the RSS driver runs.
      - run: cargo build --release --locked -p ulei-engine --features web --bin ulei-web --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-engine --features web-loopback-http --bin ulei-web --target x86_64-unknown-linux-musl --target-dir target/web-loopback
      - run: cargo build --release --locked -p ulei-channels --bin ulei-tg --target x86_64-unknown-linux-musl
      # The garden daemon, without `onnx` (ADR-0047 section 7).
      - run: cargo build --release --locked -p ulei-garden --bin ulei-garden --target x86_64-unknown-linux-musl
      # Its embedder helper, the glibc build with `onnx` (ADR-0047 section 7).
      - run: cargo build --release --locked -p ulei-garden --features onnx --bin ulei-garden-embed --target x86_64-unknown-linux-gnu
      # And the static musl build with only the encoder engine (ADR-0087 E6).
      - run: cargo build --release --locked -p ulei-garden --features native --bin ulei-garden-embed --target x86_64-unknown-linux-musl
      # The archive daemon (ADR-0051 section 7).
      - run: cargo build --release --locked -p ulei-memory --bin ulei-memory --target x86_64-unknown-linux-musl
      # The hive tools' server (ADR-0071 section 8).
      - run: cargo build --release --locked -p ulei-hive-mcp --bin ulei-hive-mcp --target x86_64-unknown-linux-musl
      # The privileged helper (ADR-0073).
      - run: cargo build --release --locked -p ulei-priv --target x86_64-unknown-linux-musl
      - name: Budgets of ulei, ulei-inbox, ulei-engine, ulei-web, ulei-tg, ulei-garden, ulei-garden-embed (both builds), ulei-memory, ulei-connectors, ulei-hive-mcp and ulei-priv
        run: >-
          ci/budgets.sh target/x86_64-unknown-linux-musl/release/ulei
          target/x86_64-unknown-linux-musl/release/ulei-inbox
          target/x86_64-unknown-linux-musl/release/ulei-engine
          target/x86_64-unknown-linux-musl/release/ulei-web
          target/web-loopback/x86_64-unknown-linux-musl/release/ulei-web
          target/x86_64-unknown-linux-musl/release/ulei-tg
          target/x86_64-unknown-linux-musl/release/ulei-garden
          target/x86_64-unknown-linux-gnu/release/ulei-garden-embed
          target/x86_64-unknown-linux-musl/release/ulei-memory
          target/x86_64-unknown-linux-musl/release/ulei-connectors
          target/x86_64-unknown-linux-musl/release/ulei-hive-mcp
          target/x86_64-unknown-linux-musl/release/ulei-priv
          target/x86_64-unknown-linux-musl/release/ulei-garden-embed

  # Retrieval recall@3 and warm p50 of the release `garden-eval` (ADR-0045 section 5) on the
  # synthetic gold set and corpus, lexical-only and with the fake embedder; no model, no network.
  # The fake run reports both the hybrid and the lexical mode.
  garden-eval:
    runs-on: ubuntu-24.04
    env:
      # Not below the floors of crates/garden/tests/eval_synthetic.rs (recall@3 0.85, debug p50
      # 50 ms). The eval is deterministic: recall@3 0.9 lets at most 3 of the 31 scored rows
      # miss. Release p50 is about 1 ms on one desktop core; 10 ms leaves room for a slow runner.
      MIN_RECALL: "0.9"
      MAX_P50_MS: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p ulei-garden --bin garden-eval
      - name: Recall and latency thresholds on the synthetic set
        run: |
          fixtures=crates/garden/tests/fixtures
          status=0
          figures=""
          for embedder in fake none; do
            rc=0
            err=$(target/release/garden-eval --gold "$fixtures/gold-synthetic.jsonl" \
              --corpus "$fixtures/garden-corpus" --embedder "$embedder" \
              --out "$RUNNER_TEMP/garden-eval-$embedder.json" \
              --min-recall "$MIN_RECALL" --max-p50-ms "$MAX_P50_MS" 2>&1) || rc=$?
            printf '%s\n' "$err"
            figures+="$embedder: $(sed -n 's/^garden-eval: measured //p' <<<"$err"); "
            if [ "$rc" -ne 0 ]; then
              status=1
              grep -v '^garden-eval: measured ' <<<"$err" | while IFS= read -r line; do
                echo "::error title=garden-eval $embedder::${line#garden-eval: }"
              done
            fi
          done
          echo "::notice title=garden-eval::${figures}thresholds recall@3 >= $MIN_RECALL, p50 <= $MAX_P50_MS ms"
          exit "$status"

  # ADR-0047 section 8: the ONNX path on the tiny model `ci/garden_onnx.py` writes at run time,
  # with the ONNX Runtime library of the pinned official package (ADR-0047 section 10): the
  # embedder tests with `onnx`, then the musl daemon with its real glibc helper. No weights in
  # the repository, no model download.
  garden-onnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORT_VERSION: 1.28.0
      ORT_NUPKG_SHA256: 769d1d3ea8ab6cd69f737c9dd4d4462aa4ad0ccfa106eaf506efc40d7bead5db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Fetch ONNX Runtime (pinned, checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$RUNNER_TEMP/ort.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/${ORT_VERSION}/microsoft.ml.onnxruntime.${ORT_VERSION}.nupkg"
          if ! echo "${ORT_NUPKG_SHA256}  $RUNNER_TEMP/ort.nupkg" | sha256sum -c -; then
            echo "::error title=garden-onnx::Microsoft.ML.OnnxRuntime ${ORT_VERSION} does not match its pinned SHA-256"
            exit 1
          fi
          unzip -j "$RUNNER_TEMP/ort.nupkg" runtimes/linux-x64/native/libonnxruntime.so -d "$RUNNER_TEMP/ort"
      - name: Tiny model
        run: python3 ci/garden_onnx.py model "$RUNNER_TEMP/tiny-model"
      - name: Embedder tests with onnx on the tiny model
        env:
          ULEI_GARDEN_TINY_MODEL_DIR: ${{ runner.temp }}/tiny-model
          ULEI_GARDEN_ORT_LIB: ${{ runner.temp }}/ort/libonnxruntime.so
        run: cargo test --locked -p ulei-garden --features onnx --test onnx_tiny -- --ignored
      - run: cargo build --release --locked -p ulei-garden --bin ulei-garden --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-garden --features onnx --bin ulei-garden-embed --target x86_64-unknown-linux-gnu
      - name: The daemon with the real helper on the tiny model
        timeout-minutes: 5
        run: >-
          python3 ci/garden_onnx.py serve target/x86_64-unknown-linux-musl/release/ulei-garden
          "$PWD/target/x86_64-unknown-linux-gnu/release/ulei-garden-embed"
          "$RUNNER_TEMP/tiny-model" "$RUNNER_TEMP/ort/libonnxruntime.so" "$(mktemp -d)"

  # ADR-0087 E6: the encoder engine's path on a tiny checkpoint `ci/garden_encoder.py` writes and
  # converts at run time: the musl daemon with the static musl helper, which picks the engine by
  # the weight file; no ONNX Runtime, no weights in the repository, no model download. It runs
  # beside `garden-onnx` while the ONNX path stays selectable (until E7).
  garden-encoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p ulei-garden --bin ulei-garden --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-garden --features native --bin ulei-garden-embed --target x86_64-unknown-linux-musl
      - name: Tiny checkpoint converted by the helper
        run: >-
          python3 ci/garden_encoder.py model "$RUNNER_TEMP/tiny-encoder"
          "$PWD/target/x86_64-unknown-linux-musl/release/ulei-garden-embed"
      - name: The daemon with the static helper on the tiny model
        timeout-minutes: 5
        run: >-
          python3 ci/garden_encoder.py serve target/x86_64-unknown-linux-musl/release/ulei-garden
          "$PWD/target/x86_64-unknown-linux-musl/release/ulei-garden-embed"
          "$RUNNER_TEMP/tiny-encoder/model" "$(mktemp -d)"

  # ADR-0042 section 10, ADR-0056 section 6: the static musl release with the test connector's
  # tree and SHA256SUMS as the artifact, a second build from a clean target directory elsewhere
  # with the same SHA256SUMS, and the install script on the artifact files under fake homes.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      # ci/release.sh sets its own RUSTFLAGS, which the automatic cache key does not see.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('ci/release.sh') }}
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Release build, and the rebuild from a clean target directory
        run: ci/release.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/rebuild"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ulei-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - name: Install script on the artifact files
        timeout-minutes: 5
        run: python3 ci/install_run.py "$RUNNER_TEMP/release" "$(mktemp -d)"
      # ADR-0078: the night gardener on the released engine, garden and archive, scripted gateway.
      - name: Night gardener end to end on the artifact files
        timeout-minutes: 5
        run: python3 ci/night_run.py "$RUNNER_TEMP/release" "$(mktemp -d)"

  # ADR-0038 section 6: the engine's gateway client against `qb` built at the pin of
  # ecosystem.lock, on fake vendors. The binary is cached per pin.
  qb-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        name: Read the qb pin from ecosystem.lock
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("ecosystem.lock", "rb") as f:
              qb = tomllib.load(f)["products"]["qb"]
          print(f"repo={qb['repo']}")
          print(f"commit={qb['commit']}")
          print(f"artifact={qb.get('artifact', '')}")
          print(f"sha256={qb.get('sha256', '')}")
          EOF
      # A pin with a release artifact tests that binary, as a host installs it (ADR-0038 section 1).
      - name: Download qb's release binary at the pin
        if: steps.pin.outputs.artifact != ''
        env:
          QB_ARTIFACT: ${{ steps.pin.outputs.artifact }}
          QB_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/qb-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/qb-bin/qb" "$QB_ARTIFACT"
          echo "$QB_SHA256  $RUNNER_TEMP/qb-bin/qb" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/qb-bin/qb"
          "$RUNNER_TEMP/qb-bin/qb" --version
      - id: cache
        if: steps.pin.outputs.artifact == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qb-bin
          key: qb-${{ steps.pin.outputs.commit }}-x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Fetch qb at the pin
        if: steps.pin.outputs.artifact == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          QB_REPO: ${{ steps.pin.outputs.repo }}
          QB_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git init -q "$RUNNER_TEMP/qb"
          git -C "$RUNNER_TEMP/qb" fetch -q --depth 1 "$QB_REPO" "$QB_COMMIT"
          git -C "$RUNNER_TEMP/qb" checkout -q FETCH_HEAD
      # qb's own static release build, as its acceptance lane runs it; qb's code is not held to
      # this workflow's warning flags.
      - name: Build qb at the pin
        if: steps.pin.outputs.artifact == '' && steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/qb
        env:
          RUSTFLAGS: ""
          CC_x86_64_unknown_linux_musl: gcc
        run: |
          cargo build --release --locked -p qb --bin qb --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/qb-bin"
          cp target/x86_64-unknown-linux-musl/release/qb "$RUNNER_TEMP/qb-bin/qb"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Let the fake vendor listen on loopback port 443
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Contract test against the pinned qb
        env:
          ULEI_QB_BIN: ${{ runner.temp }}/qb-bin/qb
        run: cargo test --locked -p ulei-engine --test qb_contract -- --ignored --test-threads=1

  # ADR-0042 section 9: the user units of deploy/systemd: exposure, verify, and the four units
  # started under the runner user's manager from the release deploy/install.sh put in place.
  # ADR-0056 section 5.7: source connector runs in their transient units under that manager, the
  # per-run budgets of its section 8, and section 9's end to end run with the real archive.
  systemd-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      # ci/release.sh sets its own RUSTFLAGS, which the automatic cache key does not see.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('ci/release.sh') }}
      # dbus-user-session gives the user manager the bus that `systemd-run --wait` needs.
      - run: sudo apt-get install -y --no-install-recommends musl-tools dbus-user-session
      - name: Release build
        run: ci/release.sh "$RUNNER_TEMP/release"
      - name: Build the connector runner, the test connector, the MCP example and the fake hive CLI
        run: |
          cargo build --locked -p ulei-core -p ulei-connector-test -p ulei-connector-mcp-example \
            -p ulei-hive-mcp --bin ulei-hive-mcp-fake-hive \
            --bin ulei-connectors --bin ulei-connector-test \
            --bin ulei-connector-mcp-example --bin ulei-connector-mcp-synthetic
      - name: Install the release where the units run it
        run: deploy/install.sh "$RUNNER_TEMP/release"
      - name: Start the runner user's manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          for _ in $(seq 60); do
            if [ -S "$runtime/systemd/private" ]; then break; fi
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime" systemctl --user is-system-running --wait || true
      # The namespace options of the units need unprivileged user namespaces in the manager.
      - name: Kernel and manager settings the units depend on
        run: |
          uname -r
          systemctl --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"
      # The checks below run even after an earlier one failed, so one run shows every result as
      # an annotation; any failed check fails the job.
      - name: Exposure of every unit within its threshold
        if: ${{ !cancelled() }}
        run: |
          status=0
          for unit in deploy/systemd/*.service; do
            name="${unit##*/}"
            case "$name" in
              # Tenths: measured 5.8 on ubuntu-24.04, systemd 255.4.
              ulei-inbox.service | ulei-engine.service | ulei-tg.service | ulei-connectors.service) threshold=58 ;;
              # AF_UNIX only.
              ulei-memory.service | ulei-garden.service | ulei-night.service) threshold=55 ;;
              ulei-hive-mcp.service) threshold=58 ;;
              *) echo "::error title=exposure $name::no exposure threshold"; status=1; continue ;;
            esac
            limit="$((threshold / 10)).$((threshold % 10))"
            out=$(systemd-analyze security --offline=yes --no-pager "$unit" 2>&1) && rc=0 || rc=$?
            printf '%s\n' "$out"
            measured=$(sed -nE 's/.*Overall exposure level for [^:]*: ([0-9]+\.[0-9]).*/\1/p' <<<"$out" | tail -n 1)
            if [ -z "$measured" ]; then
              echo "::error title=exposure $name::no exposure computed, exit $rc: $(tail -n 1 <<<"$out")"
              status=1
              continue
            fi
            echo "::notice title=exposure $name::measured $measured, threshold $limit"
            if [ "${measured/./}" -gt "$threshold" ]; then
              echo "::error title=exposure $name::measured $measured is above the threshold $limit"
              status=1
            fi
          done
          exit "$status"
      - name: Verify the units
        if: ${{ !cancelled() }}
        run: |
          status=0
          for unit in deploy/systemd/*.service deploy/systemd/*.timer deploy/systemd/*.slice; do
            name="${unit##*/}"
            out=$(systemd-analyze --user verify "$unit" 2>&1) && rc=0 || rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ] || grep -qF "$name" <<<"$out"; then
              echo "::error title=verify $name::exit $rc: $(grep -F "$name" <<<"$out" | tail -n 1)"
              status=1
            else
              echo "::notice title=verify $name::systemd-analyze --user verify passed"
            fi
          done
          exit "$status"
      - name: Load the installed units
        if: ${{ !cancelled() }}
        run: |
          systemctl --user daemon-reload
          systemctl --user log-level debug
      - name: Start test on the runner's default user namespace setting
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 ci/units_run.py default \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-units.XXXXXX)" target/debug
      # One step per group. Each folds its checks into two to four notices: GitHub keeps at most
      # 10 notices per step and 50 annotations per job.
      - name: Connector runs, sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 ci/connectors_run.py sandbox target/debug \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-connectors.XXXXXX)"
      - name: Connector runs, outcomes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 ci/connectors_run.py outcomes target/debug \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-connectors.XXXXXX)"
      - name: Connector runs, broker and direct network
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 ci/connectors_run.py broker target/debug \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-connectors.XXXXXX)"
      # About two and a half minutes: two schedule periods of 60 s and a restart.
      - name: Connector runs, schedule
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          python3 ci/connectors_run.py schedule target/debug \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-connectors.XXXXXX)"
      # ADR-0056 section 8: VmHWM after 100 runs and wchar per run of serve on the musl release
      # binary. The work directory shares the runner disk with target/debug, so each of the 100
      # connectors holds the test connector as a hard link.
      - name: Connector runner budgets, 100 runs
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          python3 ci/connectors_budget.py runs \
            target/x86_64-unknown-linux-musl/release/ulei-connectors target/debug/ulei-connector-test \
            "$(mktemp -d -p "$RUNNER_TEMP" ulei-cb.XXXXXX)"
      # On this runner only: lets the user manager create the unprivileged user namespace that
      # ProtectSystem, ProtectHome, ReadWritePaths and PrivateTmp need in a user unit.
      - name: Start test with unprivileged user namespaces allowed
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          if ! sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
            echo "::error title=sandbox start test::the runner refused kernel.apparmor_restrict_unprivileged_userns=0"
            exit 1
          fi
          python3 ci/units_run.py sandbox \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-units.XXXXXX)" target/debug
      # ADR-0056 section 9: the released test connector under the installed runner unit putting
      # into the real ulei-memory, its sync, a reset and repeated run, four runs at once and a stop.
      - name: Connectors end to end with the archive
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          python3 ci/connectors_e2e.py "$RUNNER_TEMP/release" "$RUNNER_TEMP/release/ulei-memory" \
            "$(mktemp -d -p "$XDG_RUNTIME_DIR" ulei-e2e.XXXXXX)"
      - name: Unit status and logs
        if: failure()
        run: |
          systemctl --user status --no-pager --full ulei-inbox.service ulei-engine.service ulei-tg.service ulei-connectors.service ulei-memory.service ulei-garden.service || true
          sudo journalctl --no-pager -o short-precise \
            _SYSTEMD_USER_UNIT=ulei-inbox.service _SYSTEMD_USER_UNIT=ulei-engine.service _SYSTEMD_USER_UNIT=ulei-tg.service _SYSTEMD_USER_UNIT=ulei-connectors.service _SYSTEMD_USER_UNIT=ulei-memory.service _SYSTEMD_USER_UNIT=ulei-garden.service + \
            USER_UNIT=ulei-inbox.service USER_UNIT=ulei-engine.service USER_UNIT=ulei-tg.service USER_UNIT=ulei-connectors.service USER_UNIT=ulei-memory.service USER_UNIT=ulei-garden.service | tail -n 400 || true

  # ADR-0037 section 6: the reduced delivery kill test, next to `budgets` on the same release
  # builds of both binaries.
  kill-reduced:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p ulei-core --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-engine --target x86_64-unknown-linux-musl
      - name: Delivery kill test, reduced
        timeout-minutes: 5
        run: >-
          python3 ci/deliver_kill.py target/x86_64-unknown-linux-musl/release/ulei-inbox
          target/x86_64-unknown-linux-musl/release/ulei-engine
          "$(mktemp -d -p /var/tmp ulei-kill.XXXXXX)"
          --events 300 --kills 30 --seed "$GITHUB_RUN_ID"

  # Whether the pull request's diff against its base touches the kill test harness.
  kill-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- ci/deliver_kill.py; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
          else
            echo "touched=true" >> "$GITHUB_OUTPUT"
          fi

  # ADR-0037 section 6: the full delivery kill test, on demand and on a pull request that
  # changes its harness.
  kill-full:
    needs: kill-scope
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.kill-scope.outputs.touched == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p ulei-core --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ulei-engine --target x86_64-unknown-linux-musl
      - name: Delivery kill test, full
        run: >-
          python3 ci/deliver_kill.py target/x86_64-unknown-linux-musl/release/ulei-inbox
          target/x86_64-unknown-linux-musl/release/ulei-engine
          "$(mktemp -d -p /var/tmp ulei-kill.XXXXXX)"
          --events 10000 --kills 300 --seed "$GITHUB_RUN_ID"
