# Hive configuration: every key the hive reads, with synthetic values. The hive reads the file that
# HIVE_CONFIG (or a script's --config) names and refuses one that lacks a key without a default.
# The dispatcher re-reads it every tick. Relative paths under [texts] resolve against this file's directory.

db = "/srv/hive/data/hive.db"
workspaces = "/srv/hive/data/cards"
delivery = "drop"                        # adapter that hands events to the secretary: "drop" or "ulei"; only its keys below are read
inbox = "/srv/hive/data/owner-inbox"     # drop: directory the owner-inbox library opens
inbox_library = "/srv/hive/inbox-library" # drop: directory holding the owner-inbox library module `inbox`
inbox_socket = "/srv/hive/run/ulei-inbox.sock"             # ulei: the owner inbox's C1 socket (`inbox.socket` of ulei.toml)
inbox_producer_key_file = "/srv/hive/keys/hive-producer.key" # ulei: the 32-byte C1 producer key, open to no group or other user
results_dir = "/srv/hive/data/out"        # result files; the placeholder gate reads their first lines
owner_actor = "owner"                     # created_by / --by of the owner
owner_tz = "UTC"                          # IANA zone of local days, cron defaults and steward hours
card_show_command = "HIVE_CONFIG=/srv/hive/config.toml python3 /srv/hive/hive-py/scripts/hive.py show"
script_env_file = "/srv/hive/agent/.env"  # literal assignments added to a script run's environment
steward_dir = "/srv/hive/data/steward"    # hive_steward.py --output default
rotation_log = "/srv/hive/data/reports/worktree-rotation.jsonl"  # hive_worktree_rotation.py --log default
gateway_socket = "/srv/hive/run/qb-gateway.sock"  # the qb gateway (C4G) the judge and the steward send turns to
concurrency = 5
script_concurrency = 3
script_defer_s = 900       # a script that exits 75 is queued again this many seconds later
script_defer_max = 6       # deferrals of one card before the next exit 75 blocks it
review_same_vendor_fallback = true
max_rounds = 1000000
heartbeat_stale_s = 120    # a run this long (at least 120 s) past its step timeout is killed -> timeout
spawn_grace_s = 90         # 'starting' run with no process after this long -> crashed
gate_timeout_s = 300
held_long_s = 259200       # observer alert after a created hold exceeds three days
pick_window = 12           # recent runs considered by the weighted head pick
launcher = "systemd"       # "systemd" (systemd-run --user, survives dispatcher restarts) | "popen"

# Keys a head's environment gets besides its vendor home, PATH, locale and terminal keys.
[head_env]
LIBRARY_PATH = "/srv/hive/library"
HIVE_CONFIG = "/srv/hive/config.toml"

# Environment of an acceptance command, besides LANG, HIVE_CARD and the user-bus keys.
[gate_env]
HOME = "/srv/hive/account"
PATH = "/srv/hive/account/.local/bin:/usr/local/bin:/usr/bin:/bin"
LIBRARY_PATH = "/srv/hive/library"
HIVE_CONFIG = "/srv/hive/config.toml"

# Keys set over the dispatcher's environment for a script run and a watch collector.
[script_env]
HOME = "/srv/hive/account"
PATH = "/srv/hive/account/.local/bin:/usr/local/bin:/usr/bin:/bin"
AGENT_HOME = "/srv/hive/agent"
HIVE_CONFIG = "/srv/hive/config.toml"

# Texts the hive gives a head or the secretary, used verbatim. steward_alert takes {date} and {error}.
[texts]
workspace_context = "texts/workspace-context.md"
report_request = "texts/report-request.txt"
series_news_note = "texts/series-news-note.txt"
result_note = "texts/result-note.txt"
missed_note = "texts/missed-note.txt"
steward_prompt = "texts/steward-prompt.txt"
steward_alert = "texts/steward-alert.txt"

# The one-shot judge of a head card: one C4G turn on gateway_socket per judgement, its route the alias
# routes maps from the card's step; qb resolves the alias. A retryable failure without retry_after or resets_at
# is tried again retry_s later; timeout_s bounds the whole turn.
[judge]
max_tokens = 2048
timeout_s = 300
retry_s = 300
routes = { 1 = "judge-light", 2 = "judge-light", 3 = "judge-standard", 4 = "judge-deep", 5 = "judge-deep" }

# The daily steward's model call: a C4G turn on gateway_socket and the alias route, a second one only after an
# unparseable answer; timeout_s bounds each turn. A failed turn is alerted, with no other route or CLI.
[steward]
route = "steward"
max_tokens = 4096
timeout_s = 900

# Reminders (ADR-0100): a due reminder the secretary does not claim within unclaimed_s, or leaves claimed and silent
# for claim_silence_s, is sent by the hive itself: `tg_binary notify --config tg_config` with the text on stdin. A failed
# send is tried again retry_s later, at most max_attempts sends in all; notify_timeout_s bounds one send.
[reminders]
tg_binary = "/srv/hive/bin/ulei-tg"
tg_config = "/srv/hive/ulei.toml"
unclaimed_s = 180
claim_silence_s = 300
retry_s = 60
max_attempts = 20
notify_timeout_s = 120

# The stall watchdog (ADR-0101): `hive.py watchdog`, a oneshot its timer runs every 5 minutes. Each condition below that
# holds makes one alert, a `watchdog_alert` the secretary claims and sends like a reminder; unclaimed or silent it goes
# out through [reminders] as is. The same condition is alerted again only after its cooldown_s (wait_nudge_repeat: once
# per card and pid). Every key has the default shown but the three sources, without which their condition is off.
[watchdog]
stall_s = 900              # cards that may launch waited this long, while the dispatcher has not ticked or no head started
qb_usage_pct = 90          # a provider at or above this share of its weekly qb limit (heads.weekly_left)
qb_providers = ["claude"]  # the providers of the owner loop's routes; absent = every provider qb reports
superseded_runs = 3        # the last N ended instances of a series were each superseded
escalation_age_s = 1800    # an unread escalation this old
# Prints a JSON list of {"id": string, "created_at": unix seconds, "read": boolean}; absent = no escalation check.
escalations_command = ["/srv/hive/bin/escalations", "--json"]
journal_command = ["journalctl", "--user"]  # appended: --unit=UNIT --since=@T --output=json --no-pager --quiet
bridge_unit = "example-bridge.service"      # the MCP bridge's unit; absent = no bridge check
bridge_pattern = "token refresh refused"    # a regular expression searched in each journal line's MESSAGE
bridge_window_s = 600      # journal lines this recent count
nudge_repeats = 3          # this many wait_nudge events in a row on one card and pid
command_timeout_s = 30     # one run of escalations_command or journal_command
lock_wait_s = 150          # wait this long for the dispatcher's lock before the fallback sends without it

[watchdog.cooldown_s]
queue_stalled = 3600
vendor_cooldown = 3600
qb_limit = 21600
series_superseded = 86400
escalation_unread = 86400
bridge_token_refused = 3600

# A failed worker round waits base_s doubled per consecutive retry, capped at max_s.
# A judge rework is not a failure and takes no backoff: its next round starts on the next tick.
[retry_backoff]
base_s = 300
max_s = 3600

# Step timeouts (seconds) for one head run.
[timeouts]
1 = 1200
2 = 1800
3 = 3600
4 = 7200
5 = 10800

# Ladder: difficulty step -> per-vendor model + effort.
[ladder.5]
claude = { model = "claude-large", effort = "high" }
codex  = { model = "codex-large",  effort = "high" }
[ladder.4]
claude = { model = "claude-large", effort = "high" }
codex  = { model = "codex-large",  effort = "high" }
[ladder.3]
claude = { model = "claude-large", effort = "medium" }
codex  = { model = "codex-large",  effort = "medium" }
[ladder.2]
claude = { model = "claude-small", effort = "high" }
codex  = { model = "codex-large",  effort = "medium" }
[ladder.1]
claude = { model = "claude-small", effort = "medium" }
codex  = { model = "codex-small",  effort = "medium" }

# First existing binary wins; "npx" style entries last. tag_launcher (required): the binary is the tag-aware launcher
# that hands HIVE_TAG to qb; a tagged card's heads run only on such a vendor.
[vendors.claude]
disabled = false
weight = 1.0
daily_runs = 0             # optional daily ceiling on head launches per local day; 0 or no key = off (the default). The weekly limit under [budget] is the usual guard
binary = ["/srv/hive/bin/claude", "claude"]
home = "/srv/hive/account"
tag_launcher = true

[vendors.codex]
disabled = true
weight = 1.0
binary = ["/srv/hive/bin/codex", "codex"]
home = "/srv/hive/account"
tag_launcher = false

# External executors: not heads, outside [vendors.*] and the ladder; a card names one with `create --executor`.
# command = client argv; the dispatcher appends `send TEXT` or `get JOB --json`.
[executors.dots]
command = ["python3", "/srv/hive/tools/dots.py"]
poll_s = 60                # at most one `get` per run per interval
call_timeout_s = 120       # one send/get subprocess; never a wait for the answer
timeout_s = 3600           # a sent job unanswered this long fails the round; failed polls retry until then
max_parallel = 2           # runs in starting/running at once
daily_sends = 20           # sends per local day
cooldown_s = 3600          # no send after exit 3
refuse_task_types = ["код", "code"]

[budget]
low_weekly_left_pct = 0    # below this only steps <= low_max_step run
low_max_step = 2
limits_ttl_s = 900
# Read-only usage query, no model call. Unknown/failed = allowed.
limits_command = ["/srv/hive/bin/limits", "--label", "hive", "--json"]
limits_home = "/srv/hive/account"   # HOME of limits_command

[admission]
urgent_max_step = 2        # owner_task at or below this step, queued or in review, launches as urgent
urgent_sources = ["cron:000000000001", "cron:000000000002"]  # and their :conditional children
urgent_reserve = 1         # per ceiling: non-urgent stops this many short, urgent may run this many over
urgent_floor_mb = 768      # urgent passes a closed gate while MemAvailable - starting x per_run_mb stays at or above this

[head_wait_nudge]
# A running worker whose head has run one command this long gets a nudge over its live input, again every interval
# while that command runs; another command starts over. Journaled as wait_nudge; never stops a head. 0 = off.
interval_s = 1200
# {minutes}: how long the command has run; {command}: its command line, redacted and cut. Default: an English text.
text = "You have been waiting for a command for {minutes} minutes: {command}\nAre you sure it has not hung? Check its state and result; stop it if needed and go on."

[resources]
enabled = true
max_local_runs = 5         # all heads + scripts + detached acceptance checks together
priority_sources = ["cron:backup"] # and its conditional children before ordinary cron
reserve_mb = 1024
per_run_mb = 512           # budget each new run before its RSS is visible
disk = "/srv/hive"         # the free-space floor samples this path's filesystem
# Optional disk throughput caps of every systemd head (IOWriteBandwidthMax / IOReadBandwidthMax of its transient unit).
# Effective only when the io controller is delegated to the user manager (Delegate=io on user@.service); unset = no caps.
# head_io_device = "/dev/sda"
# head_io_write_max = "10M"
# head_io_read_max = "20M"
# Ordinary admission pauses while any of these cgroups (relative to /sys/fs/cgroup) has io.pressure some avg10
# at or above protected_io_some_pct; the host PSI and iowait limits below are the emergency stop.
psi_cgroups = ["user.slice/app.slice/gateway.service", "user.slice/app.slice/hive-dispatcher.service"]
protected_io_some_pct = 10
io_some_pct = 70           # /proc/pressure/io avg10; new work pauses above either PSI limit
io_full_pct = 50
iowait_pct = 45            # delta of /proc/stat across dispatcher ticks; an emergency stop only
cooldown_s = 60            # require a quiet minute before admitting again
min_free_mb = 1536
