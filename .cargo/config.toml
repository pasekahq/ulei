[alias]
# Repository tooling (architecture checks, contract generation, module map, ADR gate).
xtask = "run --quiet --locked --package xtask --"

[env]
# Bundled SQLite without the optional modules no ulei SQL uses (ADR-0007 section 2).
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_SOUNDEX -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_JSON"
# C code of the static musl binaries carries no unwind tables (ADR-0001 section 8).
CFLAGS_x86_64_unknown_linux_musl = "-fno-asynchronous-unwind-tables -fno-unwind-tables"
