[workspace]
resolver = "3"
members = [
  "crates/contracts",
  "crates/core",
  "crates/hive",
  "crates/memory",
  "crates/runtime-adapters",
  "crates/channels",
  "crates/glue",
  "crates/engine",
  "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/pasekahq/ulei"
publish = false

# Only ulei-contracts is listed here on purpose: a module crate may depend on no other
# workspace crate (enforced by `cargo xtask arch`, ADR-0001).
[workspace.dependencies]
ulei-contracts = { path = "crates/contracts" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
regex-lite = { version = "0.1", default-features = false, features = ["std", "string"] }
signal-hook = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

# Size-first release profile; the budgets in ci/budgets.sh depend on it (ADR-0001).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Under fat LTO the opt-level of the package that links a binary governs the codegen of the
# whole binary, so this sets `ulei-engine` and `ulei-web` to "z" (ADR-0027). A package
# override drops the profile's `strip` unless it repeats it.
[profile.release.package.ulei-engine]
opt-level = "z"
strip = true
