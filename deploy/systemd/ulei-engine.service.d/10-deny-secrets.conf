# Drop-in of ulei-engine.service (ADR-0069): the paths the engine's tools, terminal commands and
# MCP servers must not read. The engine runs as the account that may also run another assistant,
# so its home holds that runtime's secrets; one prompt injection with a terminal and a network
# must not reach them. Install as
# ${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/ulei-engine.service.d/10-deny-secrets.conf,
# add the host's own secret paths in a second line, then `systemctl --user daemon-reload` and
# restart the unit. A leading "-" skips a path the host does not have.
#
# This applies only where the user manager can create the unit's namespace (part 6 of
# docs/runbooks/mvp-pilot-cutover.md reads (a)). Where it cannot, systemd ignores it silently:
# run the engine from system/ulei-engine.service instead.
[Service]
# Keys, tokens and credentials of the account and of the tools on it.
InaccessiblePaths=-%h/.ssh -%h/.gnupg -%h/.netrc -%h/.git-credentials -%h/.config/gh -%h/.docker -%h/.aws -%h/.claude -%h/.codex -%h/.config/qb
# The other assistant's runtime: its profiles, live bot token and inbox root with producer.key.
InaccessiblePaths=-%h/.hermes
# The user manager's and the session's buses: through them a command could start a unit outside
# this sandbox (systemd-run --user) or stop another one.
InaccessiblePaths=-%t/bus -%t/systemd -%t/dbus-1 -%t/gnupg
# Docker's socket is root for its group.
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock
# Host paths, one line, for example:
# InaccessiblePaths=-%h/<OWNER_DATA_DIR> -<LIVE_BOT_TOKEN_FILE>
