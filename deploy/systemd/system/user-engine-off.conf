# Drop-in of the user unit ulei-engine.service (ADR-0069) where the engine runs from the system
# unit system/ulei-engine.service: the user unit is skipped, so `ulei-tg`'s Wants= and the
# commands deploy/install.sh prints never start a second engine on the same socket. Install as
# ${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/ulei-engine.service.d/90-system-unit.conf; remove
# it (and the system unit) to go back to the user unit.
[Unit]
ConditionPathExists=!/etc/systemd/system/ulei-engine.service
