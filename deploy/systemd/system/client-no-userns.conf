# Drop-in of the user units ulei-inbox.service, ulei-tg.service, ulei-memory.service and
# ulei-garden.service (ADR-0069 section 2, ADR-0070, ADR-0075) where the engine runs from the system unit
# system/ulei-engine.service, on a host of case (b). There the user manager still puts a unit with
# namespace options into an unprivileged user namespace, whose AppArmor profile
# (`unprivileged_userns` on Ubuntu 24.04) refuses `connect` to a socket bound in another mount
# namespace ("disconnected path"): the engine's socket, and for the garden also the inbox's, which
# the inbox binds outside the user namespace under this same drop-in. These options apply on such a host in no
# case, so without them the units lose nothing and run without the user namespace. Install as
# ${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/<unit>.service.d/90-system-engine.conf for each.
[Service]
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
ReadWritePaths=
