# Drop-in of the user units ulei-inbox.service and ulei-tg.service (ADR-0069 section 2) where the
# engine runs from the system unit system/ulei-engine.service, on a host of case (b). There the
# user manager still puts a unit with namespace options into an unprivileged user namespace,
# whose AppArmor profile (`unprivileged_userns` on Ubuntu 24.04) refuses `connect` to a socket
# bound in another mount namespace ("disconnected path"): the engine's socket. These options
# apply on such a host in no case, so without them the units lose nothing and run without the
# user namespace. Install as
# ${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/<unit>.service.d/90-system-engine.conf for both.
[Service]
ProtectSystem=no
ProtectHome=no
PrivateTmp=no
ReadWritePaths=
