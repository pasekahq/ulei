# ulei.toml: the one config file of the daemons (ADR-0040). Every section and key is in
# contracts/c9-ulei-toml.schema.json, which `cargo xtask contracts` checks this file against.
# Paths, names and ids here are synthetic. Secrets are never written here: the `*_file` keys
# name files that hold them.
#
# Found from `--config PATH`, else ULEI_CONFIG, else $XDG_CONFIG_HOME/ulei/ulei.toml, else
# $HOME/.config/ulei/ulei.toml. Syntax: section headers, `key = "string"` without escapes,
# `key = integer`, `key = true` or `false`, comments and blank lines.

# ulei-inbox serve; `socket` also ulei status.
[inbox]
root = "/srv/example/inbox"
socket = "/run/example/inbox.sock"
deliver = true

# ulei-engine; `c6_socket` also ulei-tg, ulei-inbox serve and ulei status; `owner_session`
# also ulei status; `timezone` also ulei-tg.
[engine]
journal = "/srv/example/engine/journal.sqlite3"
c6_socket = "/run/example/c6.sock"
owner_session = "owner:example"
default_route = "main"
timezone = "Etc/UTC"
soul_file = "/srv/example/brain/SOUL.md"
index_file = "/srv/example/brain/INDEX.md"
memory_file = "/srv/example/brain/MEMORY.md"
user_file = "/srv/example/brain/USER.md"
memory_char_limit = 2200
user_char_limit = 1375
skills_dir = "/srv/example/skills"
disabled_skills = "alpha, beta"
# The skills index in the system prompt: off by default.
skills_index = false
# Named by the task-delegation meta-skill of the core; unset, it says no task board is configured.
task_board_file = "/srv/example/brain/task-board.md"
terminal_output = "/srv/example/engine/terminal"
concurrent_tool_timeout = 60
max_steps = 90
# The qb prompt cache mode of every request: auto_1h (default), auto or off.
prompt_cache = "auto_1h"
# The hardline floor on a grep pattern that does not parse: warn (default) or block.
hardline_malformed_mode = "warn"
service_unit = "example-engine.service"
main_channel = "example-channel"
turn_reminder_file = "/srv/example/brain/reminder.md"
# The debug trace of the turns (ADR-0092); unset, nothing is written.
trace_file = "/srv/example/engine/trace.ndjson"
stall_guards = true
web_helper = "/opt/example/bin/ulei-web"
web_base_url = "https://search.example.invalid"
web_env_file = "/srv/example/secrets/web.env"
web_store = "/srv/example/engine/web"
web_extract_char_limit = 15000
mcp_servers = "files"

[engine.empty_response_guard]
enabled = true

# On when `route` is set.
[engine.no_ask_guard]
route = "small"
note_file = "/srv/example/brain/no-ask-note.md"
instructions_file = "/srv/example/brain/no-ask-instructions.md"
log = "/srv/example/engine/no-ask.jsonl"
timeout = 30

# Seconds and shares the subset cannot write as integers are strings.
[engine.compression]
route = "small"
timeout = 120
protect_last_n = 4
target_ratio = "0.2"
threshold = "0.5"
threshold_tokens = 0
proactive_prune_tokens = 120000
proactive_prune_min_result_chars = 8000
proactive_prune_min_reclaim_tokens = 4096

# One section per route alias.
[engine.routes.main]
context_length = 200000
max_tokens = 8192

[engine.routes.small]
context_length = 128000
max_tokens = 4096

[engine.tool_loop_guardrails]
warnings_enabled = true
hard_stop_enabled = false

[engine.tool_loop_guardrails.warn_after]
exact_failure = 2
same_tool_failure = 3
idempotent_no_progress = 2

[engine.tool_loop_guardrails.hard_stop_after]
exact_failure = 5
same_tool_failure = 8
idempotent_no_progress = 5

[engine.tool_loop_guardrails.loop_caps]
max_web_searches = 0

# One section per safeguard or meta-skill of the core whose shipped text is replaced or which
# is switched off, by its id.
[engine.core.no_unfiled_promises]
file = "/srv/example/brain/core/no-unfiled-promises.md"

[engine.core.terminal_and_files]
enabled = false

# One section per name `mcp_servers` lists.
[engine.mcp.files]
url = "http://127.0.0.1:8931/mcp"
env_file = "/srv/example/secrets/files.env"
timeout = 60
connect_timeout = 10

[engine.mcp.files.tools]
include = "read_*, list"
resources = true
prompts = false

# ulei-engine and ulei status.
[qb]
socket = "/run/example/qb.sock"

# ulei-tg; it also reads `engine.c6_socket` and `engine.timezone`.
[telegram]
token_file = "/srv/example/secrets/telegram.token"
owner_ids = "1001"
attachments_dir = "/srv/example/attachments"
engine_connect_timeout = 2
engine_call_timeout = 10
base_url = "https://bot.example.invalid"
file_base_url = "https://bot.example.invalid/file"
connect_timeout = 10
read_timeout = 20
write_timeout = 20
media_read_timeout = 60
poll_timeout = 10
coalesce_quiet = 2
coalesce_max = 7
stt_env_file = "/srv/example/secrets/stt.env"
stt_base_url = "https://stt.example.invalid/v1"
stt_model = "example-stt"
stt_echo_transcripts = true
reaction_wake_delay = 15
reaction_wake_text = "The owner reacted to a message."
reaction_context_header = "Reactions:"
guest_gate_url = "http://127.0.0.1:8792/internal/telegram"
guest_gate_token_file = "/srv/example/secrets/guest-gate.token"

# ulei-engine.
[security]
redact_secrets = true

# ulei-garden serve; it also reads `inbox.socket`. Decimals are strings. Under the user unit
# (ADR-0075) `store` and `core_file` lie in $XDG_STATE_HOME/ulei/garden/, the unit's one writable
# state directory, and `socket` in $XDG_RUNTIME_DIR/ulei/ beside `inbox.socket`: the one directory
# of the runtime directory the engine's system unit shows (ADR-0069). Here /srv/example/state
# stands for $XDG_STATE_HOME/ulei and /run/example for $XDG_RUNTIME_DIR/ulei. `producer_key_file`
# is the `producer.key` the inbox creates in `inbox.root`. Setup: docs/runbooks/garden-service.md.
# ulei-engine reads `socket` for its tools `forget`, `archive_search`, `garden_search` and
# `garden_propose` and the pointers of an owner turn, and `core_file` and `core_char_limit` for
# the core profile block that ends the system prompt (ADR-0077).
[garden]
store = "/srv/example/state/garden/garden.sqlite3"
socket = "/run/example/garden.sock"
producer_key_file = "/srv/example/inbox/producer.key"
core_file = "/srv/example/state/garden/core.md"
core_char_limit = 1375
domains_file = "/srv/example/garden/domains.json"
reranker = "none"
second_level = "none"

[garden.edge]
min_confidence = "0.6"

[garden.api]
search_k = 5
pointer_min_cosine = "0.3"
pointer_min_lexical = "8.0"

# The embedder, off by default: the daemon then answers lexical only, `health` `dense: off`.
# `enabled = true` needs the helper, the model directory (`onnx/model_quantized.onnx` and
# `tokenizer.json` of bge-m3) and the ONNX Runtime library in place; a helper that does not get
# ready stops the start (ADR-0047 section 2). /srv/example/bin stands for $HOME/.local/bin, where
# deploy/install.sh puts the helper, and /srv/example/data for $XDG_DATA_HOME/ulei.
# [garden.embedder]
# enabled = true
# helper = "/srv/example/bin/ulei-garden-embed"
# model_dir = "/srv/example/data/garden/bge-m3"
# ort_library = "/srv/example/data/garden/onnxruntime/lib/libonnxruntime.so"
# threads = 2
# load_timeout = 120

# Seconds above 0, or "never".
[garden.ttl]
weather = 10800
price = 604800
law = 7776000
personal = "never"

[garden.schedule]
expire_interval = 60
recheck_interval = 3600
recheck_batch = 8
maintain_interval = 604800
verify_interval = 86400

# ulei-engine night, the night gardener (ADR-0078), run by ulei-night.timer; it also reads
# `qb.socket`, `garden.socket` and `memory.socket`; stage c stores each session's summary in the
# forest of `memory.socket` (ADR-0079). The unit sets ULEI_NIGHT_STATE to its state
# directory $XDG_STATE_HOME/ulei/night. Prices are USD per million tokens of `route`'s model.
# Setup, the dry run and the first pass over an imported history: docs/runbooks/night-gardener.md.
[night]
route = "small"
state = "/srv/example/state/night"
max_usd = "1.0"
price_input = "1.0"
price_output = "5.0"
price_cache_read = "0.1"
price_cache_write = "1.25"
max_prompt_tokens = 60000
max_tokens = 8192
timeout = 600
seed_batch = 20
# Stage d, the judge of new facts against their hints (ADR-0096): a budget of its own.
judge_max_usd = "0.5"
judge_batch = 25
sources = "dialogue,old-runtime"
separator = "/"
roles = "user,assistant"
message_chars = 3000

# ulei-memory serve: the archive and, in the same file, the forest of session summaries the night
# writes (ADR-0079); it also reads `engine.c6_socket` to pull the dialogue. ulei-engine reads
# `socket` for its tools `archive_search`, `archive_read` and `forget` (forest records), and
# ulei-engine night to walk the archive and write the forest, ulei-connectors to put items, and
# ulei-memory import to put a stream of them. Under the user unit (ADR-0070) the archive lies in
# $XDG_STATE_HOME/ulei/memory/ and the socket in $XDG_RUNTIME_DIR/ulei/, beside `inbox.socket`
# and `engine.c6_socket`: the one directory of the runtime directory the engine's system unit
# shows (ADR-0069). Setup and import: docs/runbooks/memory-archive.md.
[memory]
archive = "/srv/example/memory/memory.archive"
socket = "/run/example/memory.sock"

# ulei-connectors; it also reads `memory.socket` to put the connectors' items into the archive.
[connectors]
dir = "/srv/example/connectors"
state = "/srv/example/connectors-state"
log = "/srv/example/connectors-state/runs.jsonl"
run_dir = "/run/example/connectors"
enabled = "notes,tracker"
sync_every = 900

# The owner's records for one connector: its key and wider access than its manifest asks for.
[connectors.notes]
key_file = "/srv/example/secrets/notes.env"
allow = "notes.example.test:8443"
read = "/srv/example/shared/notes-export"
write = "/srv/example/shared/notes-outbox"

# A wrapped MCP server with its own network stack, on a host without Landlock.
[connectors.tracker]
key_file = "/srv/example/secrets/tracker.env"
network = "direct"
landlock = "off"

# ulei-hive-mcp: the hive's five typed tools for the engine (ADR-0071). The engine reaches it as
# one `[engine.mcp.<name>]` whose env-file holds `Authorization=Bearer <the token of token_file>`.
[hive_mcp]
listen = "127.0.0.1:8740"
token_file = "/srv/example/secrets/hive-mcp.token"
hive_command = "/usr/bin/python3 /srv/example/hive-py/scripts/hive.py"
hive_config = "/srv/example/hive/config.toml"
actor = "secretary"
timeout = 120
hold = false
