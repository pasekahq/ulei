[package]
name = "ulei-infer"
description = "Inference stack: shared kernels, weights and ops, models as feature-gated modules (ADR-0086)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# No default model: each user enables the models it runs.
default = []
# The BERT / XLM-RoBERTa encoder family of the garden's embedders (ADR-0086).
bert = []

[dependencies]
serde_json.workspace = true
# The read-only `mmap` of the weight file (ADR-0086 sections 2 and 5): raw syscalls, no libc.
rustix = { workspace = true, features = ["mm"] }

[[test]]
name = "golden"
required-features = ["bert"]

[[test]]
name = "golden_int8"
required-features = ["bert"]

# Memory and start-up probe of ADR-0086 E4 (a diagnostic, not shipped).
[[example]]
name = "mem_probe"
required-features = ["bert"]

# Speed probe per kernel of ADR-0086 E5 (a diagnostic, not shipped).
[[example]]
name = "speed_probe"
required-features = ["bert"]

[lints]
workspace = true

# Read by `cargo xtask arch` and `cargo xtask module-map` (ADR-0001, ADR-0072).
[package.metadata.ulei]
class = "lib"
role = "Inference stack: kernels, weights and ops once per CPU architecture; models (`bert`) as feature-gated modules (ADR-0086)."
contracts = []
# Modules that may link this library; a new user needs an ADR (ADR-0072).
users = ["ulei-garden"]
