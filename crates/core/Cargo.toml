[package]
name = "ulei-core"
description = "Core of the ecosystem: owner inbox and events (C1), module registry, config, notify fallback, MCP facade (C2), `ulei` CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ulei"
path = "src/main.rs"

[[bin]]
name = "ulei-inbox"
path = "src/bin/ulei_inbox.rs"

[dependencies]
ulei-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
rustix.workspace = true

[lints]
workspace = true

# Read by `cargo xtask arch` and `cargo xtask module-map` (ADR-0001, ADR-0002).
[package.metadata.ulei]
class = 2
role = "Core: inbox/events (C1), registry, config, notify fallback, MCP facade (C2), `ulei` CLI."
contracts = ["C1", "C2"]
