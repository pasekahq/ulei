[package]
name = "ulei-engine"
description = "Own synchronous agent loop: tool loop, tools, sessions; all model calls go to the qb gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ulei-engine"
path = "src/main.rs"

# The HTTPS helper of the web tools (ADR-0015); `ulei-engine` itself never links TLS.
[[bin]]
name = "ulei-web"
path = "src/bin/ulei-web.rs"
required-features = ["web"]

[[test]]
name = "web"
required-features = ["web-loopback-http"]

[[test]]
name = "e2e"
required-features = ["web-loopback-http"]

[features]
# Builds `ulei-web` with ureq, rustls, ring and webpki-roots.
web = ["dep:ureq", "dep:ring"]
# Test switch: `ulei-web` also takes an `http://` Exa base URL on a loopback address.
web-loopback-http = ["web"]

[dependencies]
ulei-contracts.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }
regex-lite.workspace = true
sha2.workspace = true
rusqlite.workspace = true
signal-hook.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
ring = { version = "0.17", default-features = false, optional = true }

[lints]
workspace = true

# Read by `cargo xtask arch` and `cargo xtask module-map` (ADR-0001, ADR-0002).
[package.metadata.ulei]
class = 2
role = "Engine: own agent loop, tools, sessions; models only through the qb gateway (ADR-0009)."
contracts = ["C4G", "C6", "C7", "C8", "C9", "C10"]
