[package]
name = "ulei-channels"
description = "Owner channels (Telegram first): ingress, coalescing, delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ulei-tg"
path = "src/main.rs"

[dependencies]
ulei-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
signal-hook.workspace = true
# ADR-0015 stack: blocking HTTP/1.1, rustls with ring and bundled webpki roots.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true

# Read by `cargo xtask arch` and `cargo xtask module-map` (ADR-0001, ADR-0002).
[package.metadata.ulei]
class = 2
role = "Owner channels (Telegram first)."
contracts = ["C1", "C6", "C9"]
